# schema: 'https://raw.githubusercontent.com/MultiQC/MultiQC/refs/heads/main/multiqc/utils/config_schema.json'
report_comment: >
    This report has been generated by the <a href="https://github.com/nf-core/bactmap/tree/dev" target="_blank">nf-core/bactmap</a>
    analysis pipeline. For information about how to interpret these results, please see the
    <a href="https://nf-co.re/bactmap/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
    software_versions:
        order: -1000
    nf-core-bactmap-summary:
        order: -1001

export_plots: true

data_format: 'yaml'

max_table_rows: 10000

run_modules:
    - fastqc
    - fastp
    - porechop
    - samtools
    - bcftools
    - filtlong
    - nanoq


module_order:
    - fastqc:
        name: 'PREPROCESS: FastQC (raw)'
        anchor: 'fastqc'
        info: 'This section of the report shows FastQC results for raw reads.'
        path_filters:
            - './fastqc/*'

    - fastp:
        name: 'PREPROCESS: fastp (adapter trimming)'
        info: 'This section of the report shows fastp results for reads after adapter and quality trimming.'
        path_filters:
            - './fastp/*'

    - porechop:
        name: 'PREPROCESS: Porechop (adapter trimming)'
        anchor: 'porechop'
        info: 'This section of the report shows Porechop results for reads after adapter trimming.'
        path_filters:
            - './porechop/*'

    - samtools:
        name: 'MAPPING: SAMTools (raw)'
        anchor: 'samtools'
        info: 'This section of the report shows SAMTools counts/statistics after mapping with BWA.'
        path_filters:
            - './samtools/*'

    - bcftools:
        name: 'VARIANTS: BCFTools (BCFTools)'
        anchor: 'bcftools'
        info: 'This section of the report shows BCFTools stats results for variants called by BCFTools.'
        path_filters:
            - './variants/*.txt'
    
    - filtlong:
        name: 'PREPROCESS: Filtlong (length filtering)'
        anchor: 'filtlong'
        info: 'This section of the report shows Filtlong results for reads after length filtering.'
        path_filters:
            - './filtlong/*'

    - nanoq:
        name: 'PREPROCESS: NanoPlot (raw)'
        anchor: 'nanoq'
        info: 'This section of the report shows NanoPlot results for raw reads.'
        path_filters:
            - './nanoq/*'

    
