# multiqc_config.yml

report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/bactmap/tree/dev" target="_blank">nf-core/bactmap</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/bactmap/dev/docs/output" target="_blank">documentation</a>.

# Report section order
report_section_order:
  "nf-core-bactmap-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-bactmap-summary":
    order: -1002
  general_stats:
    order: 1000
  fastqc:
    order: 900
  fastp:
    order: 800
  porechop:
    order: 700
  porechop_abi:
    order: 600
  filtlong:
    order: 500
  nanoq:
    order: 400
  fastqc-1:
    order: 300
  samtools:
    order: 200
  bcftools:
    order: 100

# List of run modules
run_modules:
  - fastqc
  - fastp
  - adapterremoval
  - porechop
  - porechop_abi
  - filtlong
  - nanoq
  - samtools
  - bcftools
  - custom_content

# File path filters
sp:
  fastqc/data:
    fn_re: ".*(fastqc|falco)_data.txt$"
  fastqc/zip:
    fn: "*_fastqc.zip"
  fastp:
    fn: "*.fastp.json"
  filtlong:
    contents: Scoring long reads
    contents_re: " "

# Top-level module definitions
top_modules:
  - "fastqc":
      name: "FastQC / Falco (pre-Trimming)"
      path_filters:
        - "*raw*"
      path_filters_exclude:
        - "*processed*"
      extra: |
        If used in this run, Falco is a drop-in replacement for FastQC producing
        the same output, written by Guilherme de Sena Brandine and Andrew D. Smith.
  - "fastqc":
      name: "FastQC / Falco (post-Trimming)"
      path_filters:
        - "*processed*"
      path_filters_exclude:
        - "*raw*"
      extra: |
        If used in this run, Falco is a drop-in replacement for FastQC producing
        the same output, written by Guilherme de Sena Brandine and Andrew D. Smith.
  - "porechop":
      name: "Porechop"
      anchor: "porechop"
      target: "Porechop"
      path_filters:
        - "*porechop.log"
      extra: |
        ℹ️: If you get the error message 'Error - was not able to plot data.'
        this means that porechop did not detect any adapters and therefore no statistics
        generated.
  - "porechop":
      name: "Porechop_ABI"
      anchor: "porechop_abi"
      target: "Porechop_ABI"
      doi: "10.1093/bioadv/vbac085"
      info: "Find and remove adapters from Oxford Nanopore reads."
      path_filters:
        - "*porechop_abi.log"
      extra: |
        ℹ️: If you get the error message 'Error - was not able to plot data.'
        this means that porechop_abi did not detect any adapters and therefore no statistics
        generated.
  - "filtlong":
      name: "Filtlong"
      anchor: "filtlong"
      target: "Filtlong"
      doi: "10.1371/journal.pcbi.1010905"
      info: "This section of the report shows Filtlong results for reads after length filtering."
      path_filters:
        - "*filtlong/*"
      extra: |
        ℹ️: If you get the error message 'Error - was not able to plot data.'
        this means that filtlong did not detect any worse reads and therefore no statistics
        generated.
  - "nanoq":
      name: "Nanoq"
      anchor: "nanoq"
      target: "Nanoq"
      doi: "10.21105/joss.02991"
      info: "This section of the report shows Nanoq results for Nanopore reads"
      path_filters:
        - "*nanoq.log"
      extra: |
        ℹ️: If you get the error message 'Error - was not able to plot data.'
        this means that nanoq did not generate any results for the reads, and no statistics are available.
  - samtools:
      name: "SAMTools Stats"
      anchor: "samtools"
      target: "SAMTools"
      doi: "10.1093/bioinformatics/btp352"
      info: "This section of the report shows SAMTools counts/statistics after mapping with Bowtie 2/BWA 2 mem."
      path_filters:
        - "*.stats"
  - "bcftools":
      name: "BCFTools"
      anchor: "bcftools"
      target: "BCFTools"
      doi: "10.1093/bioinformatics/btp352"
      info: "This section of the report shows BCFTools stats results for the called variants."
      path_filters:
        - "*.txt"

# Table columns for each module
table_columns_placement:
  FastQC / Falco (pre-Trimming):
    total_sequences: 100
    avg_sequence_length: 110
    median_sequence_length: 120
    percent_duplicates: 130
    percent_gc: 140
    percent_fails: 150
  FastQC / Falco (post-Trimming):
    total_sequences: 200
    avg_sequence_length: 210
    median_sequence_length: 220
    percent_duplicates: 230
    percent_gc: 240
    percent_fails: 250
  fastp:
    pct_adapter: 300
    pct_surviving: 310
    pct_duplication: 320
    after_filtering_gc_content: 330
    after_filtering_q30_rate: 340
    after_filtering_q30_bases: 350
    filtering_result_passed_filter_reads: 360
  Adapter Removal:
    aligned_total: 360
    percent_aligned: 370
    percent_collapsed: 380
    percent_discarded: 390
  Porechop:
    Input Reads: 500
    Start Trimmed: 510
    Start Trimmed Percent: 520
    End Trimmed: 530
    End Trimmed Percent: 540
    Middle Split: 550
    Middle Split Percent: 560
  Porechop_ABI:
    Input Reads: 500
    Start Trimmed: 510
    Start Trimmed Percent: 520
    End Trimmed: 530
    End Trimmed Percent: 540
    Middle Split: 550
    Middle Split Percent: 560
  Filtlong:
    Target bases: 600
  nanoq:
    Reads: 700
    Read N50: 710
  SAMTools Stats:
    raw_total_sequences: 800
    reads_mapped: 810
    reads_mapped_percent: 820
    reads_properly_paired_percent: 830
    non-primary_alignments: 840
    reads_MQ0_percent: 850
    error_rate: 860

# Table columns visibility
table_columns_visible:
  FastQC / Falco (pre-Trimming):
    total_sequences: true
    avg_sequence_length: true
    percent_duplicates: true
    percent_gc: true
    percent_fails: false
  FastQC / Falco (post-Trimming):
    total_sequences: true
    avg_sequence_length: true
    percent_duplicates: false
    percent_gc: false
    percent_fails: false
  Adapter Removal:
    aligned_total: true
    percent_aligned: true
    percent_collapsed: true
    percent_discarded: false
  fastp:
    pct_adapter: true
    pct_surviving: true
    pct_duplication: false
    after_filtering_gc_content: false
    after_filtering_q30_rate: false
    after_filtering_q30_bases: false
  porechop:
    Input reads: false
    Start Trimmed: true
    Start Trimmed Percent: true
    End Trimmed: false
    End Trimmed Percent: true
    Middle Split: false
    Middle Split Percent: true
  porechop_abi:
    Input reads: false
    Start Trimmed: true
    Start Trimmed Percent: true
    End Trimmed: false
    End Trimmed Percent: true
    Middle Split: false
    Middle Split Percent: true
  Filtlong:
    Target bases: true
  nanoq:
    ReadN50: true
    Reads: true

# Column names for each module
table_columns_name:
  FastQC / Falco (pre-Trimming):
    total_sequences: "Nr. Input Reads"
    avg_sequence_length: "Length Input Reads"
    percent_gc: "% GC Input Reads"
    percent_duplicates: "% Dups Input Reads"
    percent_fails: "% Failed Input Reads"
  FastQC / Falco (post-Trimming):
    total_sequences: "Nr. Processed Reads"
    avg_sequence_length: "Length Processed Reads"
    percent_gc: "% GC Processed Reads"
    percent_duplicates: "% Dups Processed Reads"
    percent_fails: "% Failed Processed Reads"
  SAMTools Stats:
    raw_total_sequences: "Nr. Reads Into Mapping"
    reads_mapped: "Nr. Mapped Reads"
    reads_mapped_percent: "% Mapped Reads"

# Clean-up extensions
extra_fn_clean_exts:
  - ".txt"
  - "_filtered"
  - "porechop"
  - "porechop_abi"
  - "_processed"
  - type: remove
    pattern: "_falco"

# Section comments for further info
section_comments:
  general_stats: |
    By default, all read count columns are displayed as millions (M) of reads.

# Export plots and disable version detection
export_plots: true
disable_version_detection: true