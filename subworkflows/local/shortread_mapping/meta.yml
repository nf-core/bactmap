# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "shortread_mapping"
description: Map short reads to a reference genome with BWA-MEM 2 or bowtie2 and sort the output BAM files
keywords:
  - align
  - fasta
  - genome
  - reference
  - bam
components:
  - fastq_align_bowtie2
  - fastq_align_bwamem2
  - bam_variant_calling_sort_freebayes_bcftools
  - bcftools/filter
  - bcftools/stats
  - consensus_bcftools
  - seqtk/comp
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - ch_fasta:
      type: file
      description: Reference fasta file
      pattern: "*.{fasta,fa}"
  - ch_index:
      type: file
      description: BWA-MEM or bowtie2 reference genome index files
      pattern: "*.{bt2,amb,ann,bwt,pac,sa,alt}"
  - ch_faidx:
      type: file
      description: samtools reference genome index files
      pattern: "*.fai"
  - ch_reads:
      type: file
      description: |
        List of input FastQ files
output:
  - bam:
      type: file
      description: |
        Channel containing BAM files
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - bai:
      type: file
      description: |
        Channel containing indexed BAM (BAI) files
        Structure: [ val(meta), path(bai) ]
      pattern: "*.bai"
  - vcf:
      type: file
      description: |
        Channel containing Sorted VCF files
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.{vcf.gz}"
  - csi:
      type: file
      description: |
        Channel containing CSI files
        Structure: [ val(meta), path(csi) ]
      pattern: "*.csi"
  - tbi:
      type: file
      description: |
        Channel containing TBI files
        Structure: [ val(meta), path(tbi) ]
      pattern: "*.tbi"
  - stats:
      type: file
      description: |
        Channel containing bcftools stats files
        Structure: [ val(meta), path(tbi) ]
      pattern: "*.txt"
  - consensus:
      type: file
      description: |
        Channel containing consensus FASTA files
        Structure: [ val(meta), path(consensus) ]
      pattern: "*.fa"
  - seqtk_stats:
      type: file
      description: |
        Channel containing seqtk stats files
        Structure: [ val(meta), path(consensus) ]
      pattern: "*.tsv"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@avantonder"
maintainers:
  - "@avantonder"
