# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "shortread_preprocessing"
description: Perform filtering and adapter removal of long read FASTQ files
keywords:
  - preprocessing
  - cleaning
  - fastq
components:
  - shortread_fastp
  - shortread_adapterremoval
  - fastqc
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - reads:
      type: file
      description: |
        List of input FastQ files of size 1 and 2 for single-end and paired-end data,
        respectively.
  - adapterlist:
      type: file
      description: |
        List of adapters to remove from the reads.
        Structure: [ path(adapterlist) ]
      pattern: "*.txt"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - reads:
      type: file
      description: |
        Channel containing cleaned FASTQ files
        Structure: [ val(meta), path(reads) ]
      pattern: "*.fastq.gz"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@jfy133"
  - "@sofstam"
  - "@Midnighter"
  - "@LilyAnderssonLee"
maintainers:
  - "@avantonder"
